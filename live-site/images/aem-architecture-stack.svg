<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="600" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="300" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0e7490">AEM Architecture Stack</text>
  <!-- Layer 1: AEM Application -->
  <rect x="60" y="52" width="480" height="56" rx="10" fill="url(#g1)" filter="url(#shadow)"/>
  <text x="300" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">AEM Application</text>
  <text x="300" y="96" text-anchor="middle" font-size="11" fill="#cffafe">Components • Templates • Workflows • DAM • Sites</text>
  <!-- Arrow -->
  <polygon points="300,108 292,118 308,118" fill="#94a3b8"/>
  <!-- Layer 2: Apache Sling -->
  <rect x="60" y="122" width="480" height="56" rx="10" fill="url(#g2)" filter="url(#shadow)"/>
  <text x="300" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Apache Sling</text>
  <text x="300" y="166" text-anchor="middle" font-size="11" fill="#ede9fe">RESTful Web Framework • URL → Resource → Script</text>
  <!-- Arrow -->
  <polygon points="300,178 292,188 308,188" fill="#94a3b8"/>
  <!-- Layer 3: JCR -->
  <rect x="60" y="192" width="480" height="56" rx="10" fill="url(#g3)" filter="url(#shadow)"/>
  <text x="300" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">JCR — Jackrabbit Oak</text>
  <text x="300" y="236" text-anchor="middle" font-size="11" fill="#d1fae5">Content Repository • Nodes &amp; Properties • Tree Structure</text>
  <!-- Arrow -->
  <polygon points="300,248 292,258 308,258" fill="#94a3b8"/>
  <!-- Layer 4: OSGi -->
  <rect x="60" y="262" width="480" height="56" rx="10" fill="url(#g4)" filter="url(#shadow)"/>
  <text x="300" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">OSGi — Apache Felix</text>
  <text x="300" y="306" text-anchor="middle" font-size="11" fill="#fef3c7">Modular Runtime • Bundles • Services • Hot Deploy</text>
  <!-- Arrow -->
  <polygon points="300,318 292,328 308,328" fill="#94a3b8"/>
  <!-- Layer 5: Java -->
  <rect x="60" y="332" width="480" height="56" rx="10" fill="url(#g5)" filter="url(#shadow)"/>
  <text x="300" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Java Virtual Machine (JVM)</text>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#fecaca">Runtime Environment • Java 11+ (Cloud) / Java 8 (6.5)</text>
  <!-- Side labels -->
  <text x="20" y="84" font-size="9" fill="#64748b" font-weight="600" transform="rotate(-90,20,84)">REQUEST</text>
  <text x="580" y="84" font-size="9" fill="#64748b" font-weight="600" transform="rotate(90,580,84)">RESPONSE</text>
  <text x="300" y="410" text-anchor="middle" font-size="10" fill="#94a3b8">Each layer depends on the one below it</text>
</svg>