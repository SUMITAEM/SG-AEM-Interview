<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="ab" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0891b2"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#d97706"/></marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">AEM Author → Dispatcher → Publish → CDN Architecture</text>
  <!-- Author -->
  <rect x="20" y="70" width="140" height="130" rx="12" fill="url(#ab)" filter="url(#sh)"/>
  <text x="90" y="100" text-anchor="middle" font-size="24">✍️</text>
  <text x="90" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Author</text>
  <text x="90" y="142" text-anchor="middle" font-size="10" fill="#ede9fe">Port 4502</text>
  <line x1="35" y1="152" x2="145" y2="152" stroke="rgba(255,255,255,0.2)"/>
  <text x="90" y="168" text-anchor="middle" font-size="9" fill="#ddd6fe">Content Creation</text>
  <text x="90" y="181" text-anchor="middle" font-size="9" fill="#ddd6fe">Page Editing</text>
  <text x="90" y="194" text-anchor="middle" font-size="9" fill="#ddd6fe">DAM Management</text>
  <!-- Arrow: Author → Publish -->
  <line x1="160" y1="115" x2="208" y2="115" stroke="#0891b2" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="184" y="108" text-anchor="middle" font-size="8" fill="#0891b2" font-weight="600">Replicate</text>
  <!-- Publish -->
  <rect x="215" y="70" width="140" height="130" rx="12" fill="url(#pb)" filter="url(#sh)"/>
  <text x="285" y="100" text-anchor="middle" font-size="24">🌍</text>
  <text x="285" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Publish</text>
  <text x="285" y="142" text-anchor="middle" font-size="10" fill="#d1fae5">Port 4503</text>
  <line x1="230" y1="152" x2="340" y2="152" stroke="rgba(255,255,255,0.2)"/>
  <text x="285" y="168" text-anchor="middle" font-size="9" fill="#a7f3d0">Content Delivery</text>
  <text x="285" y="181" text-anchor="middle" font-size="9" fill="#a7f3d0">Read-Only Access</text>
  <text x="285" y="194" text-anchor="middle" font-size="9" fill="#a7f3d0">Anonymous Users</text>
  <!-- Arrow: Publish → Dispatcher -->
  <line x1="355" y1="135" x2="408" y2="135" stroke="#0891b2" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- Dispatcher -->
  <rect x="415" y="70" width="140" height="130" rx="12" fill="url(#db)" filter="url(#sh)"/>
  <text x="485" y="100" text-anchor="middle" font-size="24">🛡️</text>
  <text x="485" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Dispatcher</text>
  <text x="485" y="142" text-anchor="middle" font-size="10" fill="#fef3c7">Apache Module</text>
  <line x1="430" y1="152" x2="540" y2="152" stroke="rgba(255,255,255,0.2)"/>
  <text x="485" y="168" text-anchor="middle" font-size="9" fill="#fde68a">Caching Layer</text>
  <text x="485" y="181" text-anchor="middle" font-size="9" fill="#fde68a">Security Filters</text>
  <text x="485" y="194" text-anchor="middle" font-size="9" fill="#fde68a">Load Balancing</text>
  <!-- Arrow: Dispatcher → CDN -->
  <line x1="555" y1="135" x2="598" y2="135" stroke="#0891b2" stroke-width="2.5" marker-end="url(#ar)"/>
  <!-- CDN -->
  <rect x="605" y="70" width="95" height="130" rx="12" fill="url(#cb)" filter="url(#sh)"/>
  <text x="652" y="100" text-anchor="middle" font-size="24">⚡</text>
  <text x="652" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">CDN</text>
  <text x="652" y="142" text-anchor="middle" font-size="10" fill="#cffafe">Edge Cache</text>
  <line x1="615" y1="152" x2="690" y2="152" stroke="rgba(255,255,255,0.2)"/>
  <text x="652" y="168" text-anchor="middle" font-size="9" fill="#a5f3fc">Fastly</text>
  <text x="652" y="181" text-anchor="middle" font-size="9" fill="#a5f3fc">CloudFront</text>
  <text x="652" y="194" text-anchor="middle" font-size="9" fill="#a5f3fc">Akamai</text>
  <!-- Reverse replication arrow -->
  <line x1="210" y1="170" x2="165" y2="170" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ar2)"/>
  <text x="188" y="185" text-anchor="middle" font-size="7" fill="#d97706">Reverse Repl.</text>
  <!-- Flush agent arrow -->
  <line x1="120" y1="200" x2="120" y2="248" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="120" y1="248" x2="480" y2="248" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="480" y1="248" x2="480" y2="205" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="480,205 476,212 484,212" fill="#dc2626"/>
  <text x="300" y="242" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">Dispatcher Flush Agent (Cache Invalidation)</text>
  <!-- Users -->
  <text x="652" y="230" text-anchor="middle" font-size="22">👤</text>
  <text x="652" y="252" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600">End Users</text>
  <!-- Legend -->
  <rect x="20" y="275" width="680" height="32" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="40" cy="291" r="5" fill="#0891b2"/><text x="50" y="295" font-size="9" fill="#475569">Request Flow</text>
  <line x1="130" y1="291" x2="155" y2="291" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="160" y="295" font-size="9" fill="#475569">Reverse Replication</text>
  <line x1="290" y1="291" x2="315" y2="291" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="320" y="295" font-size="9" fill="#475569">Flush Agent</text>
  <text x="440" y="295" font-size="9" fill="#475569">Author: <tspan font-weight="700">4502</tspan> | Publish: <tspan font-weight="700">4503</tspan></text>
</svg>