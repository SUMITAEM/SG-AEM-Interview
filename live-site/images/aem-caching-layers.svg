<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0891b2"/></marker>
  </defs>
  <rect width="700" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">AEM Caching Layers — Request Journey</text>
  <!-- Speed indicator -->
  <text x="40" y="58" font-size="9" fill="#059669" font-weight="700">⚡ FASTEST</text>
  <text x="620" y="58" font-size="9" fill="#dc2626" font-weight="700">SLOWEST 🐢</text>
  <line x1="100" y1="55" x2="615" y2="55" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Layer 1: Browser Cache -->
  <rect x="25" y="75" width="130" height="120" rx="10" fill="#059669" filter="url(#ds)"/>
  <text x="90" y="100" text-anchor="middle" font-size="22">🖥️</text>
  <text x="90" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Browser Cache</text>
  <line x1="40" y1="128" x2="140" y2="128" stroke="rgba(255,255,255,0.2)"/>
  <text x="90" y="144" text-anchor="middle" font-size="9" fill="#d1fae5">Cache-Control</text>
  <text x="90" y="157" text-anchor="middle" font-size="9" fill="#d1fae5">ETag / Last-Modified</text>
  <text x="90" y="170" text-anchor="middle" font-size="9" fill="#d1fae5">Service Worker</text>
  <text x="90" y="186" text-anchor="middle" font-size="8" fill="#a7f3d0" font-weight="600">~0ms latency</text>
  <!-- Arrow -->
  <line x1="155" y1="135" x2="183" y2="135" stroke="#0891b2" stroke-width="2" marker-end="url(#ar)"/>
  <text x="169" y="128" text-anchor="middle" font-size="7" fill="#64748b">MISS</text>
  <!-- Layer 2: CDN -->
  <rect x="190" y="75" width="130" height="120" rx="10" fill="#0891b2" filter="url(#ds)"/>
  <text x="255" y="100" text-anchor="middle" font-size="22">⚡</text>
  <text x="255" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CDN Edge</text>
  <line x1="205" y1="128" x2="305" y2="128" stroke="rgba(255,255,255,0.2)"/>
  <text x="255" y="144" text-anchor="middle" font-size="9" fill="#cffafe">Fastly / CloudFront</text>
  <text x="255" y="157" text-anchor="middle" font-size="9" fill="#cffafe">Akamai</text>
  <text x="255" y="170" text-anchor="middle" font-size="9" fill="#cffafe">Geographic edge</text>
  <text x="255" y="186" text-anchor="middle" font-size="8" fill="#a5f3fc" font-weight="600">~5-20ms latency</text>
  <!-- Arrow -->
  <line x1="320" y1="135" x2="348" y2="135" stroke="#0891b2" stroke-width="2" marker-end="url(#ar)"/>
  <text x="334" y="128" text-anchor="middle" font-size="7" fill="#64748b">MISS</text>
  <!-- Layer 3: Dispatcher -->
  <rect x="355" y="75" width="130" height="120" rx="10" fill="#d97706" filter="url(#ds)"/>
  <text x="420" y="100" text-anchor="middle" font-size="22">🛡️</text>
  <text x="420" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Dispatcher</text>
  <line x1="370" y1="128" x2="470" y2="128" stroke="rgba(255,255,255,0.2)"/>
  <text x="420" y="144" text-anchor="middle" font-size="9" fill="#fef3c7">Apache Module</text>
  <text x="420" y="157" text-anchor="middle" font-size="9" fill="#fef3c7">File-system cache</text>
  <text x="420" y="170" text-anchor="middle" font-size="9" fill="#fef3c7">stat file invalidation</text>
  <text x="420" y="186" text-anchor="middle" font-size="8" fill="#fde68a" font-weight="600">~20-50ms latency</text>
  <!-- Arrow -->
  <line x1="485" y1="135" x2="523" y2="135" stroke="#0891b2" stroke-width="2" marker-end="url(#ar)"/>
  <text x="504" y="128" text-anchor="middle" font-size="7" fill="#64748b">MISS</text>
  <!-- Layer 4: AEM Publish -->
  <rect x="530" y="75" width="145" height="120" rx="10" fill="#dc2626" filter="url(#ds)"/>
  <text x="602" y="100" text-anchor="middle" font-size="22">🌍</text>
  <text x="602" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">AEM Publish</text>
  <line x1="545" y1="128" x2="660" y2="128" stroke="rgba(255,255,255,0.2)"/>
  <text x="602" y="144" text-anchor="middle" font-size="9" fill="#fecaca">Full page render</text>
  <text x="602" y="157" text-anchor="middle" font-size="9" fill="#fecaca">Sling resolution</text>
  <text x="602" y="170" text-anchor="middle" font-size="9" fill="#fecaca">JCR query + HTL</text>
  <text x="602" y="186" text-anchor="middle" font-size="8" fill="#fca5a5" font-weight="600">~200-500ms latency</text>
  <!-- Bottom stats -->
  <rect x="25" y="215" width="650" height="70" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="350" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Cache Hit Rates — Target Goals</text>
  <rect x="45" y="248" width="140" height="24" rx="4" fill="#059669"/>
  <text x="115" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Browser: ~60-80%</text>
  <rect x="200" y="248" width="140" height="24" rx="4" fill="#0891b2"/>
  <text x="270" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">CDN: ~85-95%</text>
  <rect x="355" y="248" width="140" height="24" rx="4" fill="#d97706"/>
  <text x="425" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Dispatcher: ~90-99%</text>
  <rect x="510" y="248" width="140" height="24" rx="4" fill="#dc2626"/>
  <text x="580" y="264" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">AEM: only ~1-5%</text>
</svg>