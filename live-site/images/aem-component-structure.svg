<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 380" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="650" height="380" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="325" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">AEM Component Structure</text>
  <!-- Root folder -->
  <rect x="40" y="50" width="570" height="310" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="72" font-size="12" font-weight="700" fill="#1e293b">📁 /apps/mysite/components/hero/</text>
  <!-- .content.xml -->
  <rect x="70" y="88" width="240" height="52" rx="8" fill="#7c3aed" filter="url(#ds)"/>
  <text x="90" y="110" font-size="11" font-weight="700" fill="#fff">📄 .content.xml</text>
  <text x="90" y="128" font-size="9" fill="#ede9fe">jcr:primaryType, componentGroup,</text>
  <text x="90" y="138" font-size="9" fill="#ede9fe">sling:resourceSuperType, jcr:title</text>
  <!-- _cq_dialog -->
  <rect x="340" y="88" width="240" height="52" rx="8" fill="#0891b2" filter="url(#ds)"/>
  <text x="360" y="110" font-size="11" font-weight="700" fill="#fff">📁 _cq_dialog/</text>
  <text x="360" y="128" font-size="9" fill="#cffafe">Touch UI Dialog (Coral/Granite)</text>
  <text x="360" y="138" font-size="9" fill="#cffafe">textfield, pathfield, multifield...</text>
  <!-- HTL file -->
  <rect x="70" y="155" width="240" height="52" rx="8" fill="#059669" filter="url(#ds)"/>
  <text x="90" y="177" font-size="11" font-weight="700" fill="#fff">📄 hero.html (HTL)</text>
  <text x="90" y="195" font-size="9" fill="#d1fae5">data-sly-use, data-sly-test,</text>
  <text x="90" y="205" font-size="9" fill="#d1fae5">${properties.title @ context='html'}</text>
  <!-- Sling Model -->
  <rect x="340" y="155" width="240" height="52" rx="8" fill="#d97706" filter="url(#ds)"/>
  <text x="360" y="177" font-size="11" font-weight="700" fill="#fff">☕ HeroModel.java</text>
  <text x="360" y="195" font-size="9" fill="#fef3c7">@Model(adaptables=Resource.class)</text>
  <text x="360" y="205" font-size="9" fill="#fef3c7">@ValueMapValue, @PostConstruct</text>
  <!-- ClientLib -->
  <rect x="70" y="222" width="240" height="52" rx="8" fill="#dc2626" filter="url(#ds)"/>
  <text x="90" y="244" font-size="11" font-weight="700" fill="#fff">📁 clientlib/ (CSS/JS)</text>
  <text x="90" y="262" font-size="9" fill="#fecaca">categories: mysite.hero</text>
  <text x="90" y="272" font-size="9" fill="#fecaca">css.txt, js.txt, styles.css</text>
  <!-- Edit Config -->
  <rect x="340" y="222" width="240" height="52" rx="8" fill="#64748b" filter="url(#ds)"/>
  <text x="360" y="244" font-size="11" font-weight="700" fill="#fff">📄 _cq_editConfig.xml</text>
  <text x="360" y="262" font-size="9" fill="#e2e8f0">In-place editing config,</text>
  <text x="360" y="272" font-size="9" fill="#e2e8f0">drag &amp; drop behavior, listeners</text>
  <!-- Design Dialog -->
  <rect x="70" y="289" width="240" height="52" rx="8" fill="#6366f1" filter="url(#ds)"/>
  <text x="90" y="311" font-size="11" font-weight="700" fill="#fff">📁 _cq_design_dialog/</text>
  <text x="90" y="329" font-size="9" fill="#e0e7ff">Content Policy dialog fields,</text>
  <text x="90" y="339" font-size="9" fill="#e0e7ff">Style System CSS class config</text>
  <!-- Proxy note -->
  <rect x="340" y="289" width="240" height="52" rx="8" fill="#0f172a" filter="url(#ds)" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="360" y="307" font-size="10" font-weight="700" fill="#22d3ee">💡 Proxy Component Pattern</text>
  <text x="360" y="323" font-size="9" fill="#94a3b8">sling:resourceSuperType =</text>
  <text x="360" y="336" font-size="9" fill="#67e8f9">core/wcm/components/image/v3/image</text>
  <text x="360" y="349" font-size="8" fill="#64748b">Always extend Core Components, never modify /libs</text>
</svg>