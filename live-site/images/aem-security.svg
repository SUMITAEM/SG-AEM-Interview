<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="700" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">AEM Security Layers</text>
  <!-- Layer boxes -->
  <rect x="30" y="48" width="200" height="120" rx="10" fill="#dc2626" filter="url(#ds)"/>
  <text x="130" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">🛡️ Dispatcher</text>
  <text x="130" y="88" text-anchor="middle" font-size="9" fill="#fecaca" font-weight="600">First line of defense</text>
  <line x1="45" y1="96" x2="215" y2="96" stroke="rgba(255,255,255,0.2)"/>
  <text x="45" y="113" font-size="9" fill="#fca5a5">• Filter /crx, /system/console</text>
  <text x="45" y="127" font-size="9" fill="#fca5a5">• Block /bin/querybuilder.json</text>
  <text x="45" y="141" font-size="9" fill="#fca5a5">• Allow only safe URL patterns</text>
  <text x="45" y="155" font-size="9" fill="#fca5a5">• SSL/TLS termination</text>

  <rect x="250" y="48" width="200" height="120" rx="10" fill="#d97706" filter="url(#ds)"/>
  <text x="350" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">🔐 Authentication</text>
  <text x="350" y="88" text-anchor="middle" font-size="9" fill="#fef3c7" font-weight="600">Who are you?</text>
  <line x1="265" y1="96" x2="435" y2="96" stroke="rgba(255,255,255,0.2)"/>
  <text x="265" y="113" font-size="9" fill="#fde68a">• SAML / SSO for Author</text>
  <text x="265" y="127" font-size="9" fill="#fde68a">• Adobe IMS (JWT/OAuth)</text>
  <text x="265" y="141" font-size="9" fill="#fde68a">• CUG (Closed User Groups)</text>
  <text x="265" y="155" font-size="9" fill="#fde68a">• Service Users for OSGi</text>

  <rect x="470" y="48" width="200" height="120" rx="10" fill="#059669" filter="url(#ds)"/>
  <text x="570" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">✅ Authorization</text>
  <text x="570" y="88" text-anchor="middle" font-size="9" fill="#d1fae5" font-weight="600">What can you do?</text>
  <line x1="485" y1="96" x2="655" y2="96" stroke="rgba(255,255,255,0.2)"/>
  <text x="485" y="113" font-size="9" fill="#a7f3d0">• ACLs on JCR paths</text>
  <text x="485" y="127" font-size="9" fill="#a7f3d0">• rep:policy nodes</text>
  <text x="485" y="141" font-size="9" fill="#a7f3d0">• Allow / Deny rules</text>
  <text x="485" y="155" font-size="9" fill="#a7f3d0">• Group-based permissions</text>

  <!-- Code Security -->
  <rect x="30" y="185" width="310" height="115" rx="10" fill="#7c3aed" filter="url(#ds)"/>
  <text x="185" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">💻 Code-Level Protection</text>
  <line x1="45" y1="216" x2="325" y2="216" stroke="rgba(255,255,255,0.2)"/>
  <text x="45" y="234" font-size="10" fill="#ddd6fe">XSS Prevention:</text>
  <text x="170" y="234" font-size="9" fill="#ede9fe">HTL auto-escapes (context='html')</text>
  <text x="45" y="252" font-size="10" fill="#ddd6fe">CSRF Protection:</text>
  <text x="170" y="252" font-size="9" fill="#ede9fe">Built-in token validation</text>
  <text x="45" y="270" font-size="10" fill="#ddd6fe">Input Validation:</text>
  <text x="170" y="270" font-size="9" fill="#ede9fe">Sanitize in servlets</text>
  <text x="45" y="288" font-size="10" fill="#ddd6fe">No Admin Session:</text>
  <text x="170" y="288" font-size="9" fill="#ede9fe">Always use service users</text>

  <!-- Critical Rules -->
  <rect x="360" y="185" width="310" height="115" rx="10" fill="#1e293b" filter="url(#ds)"/>
  <text x="515" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">⚠️ Critical Security Rules</text>
  <line x1="375" y1="216" x2="655" y2="216" stroke="rgba(255,255,255,0.15)"/>
  <text x="375" y="234" font-size="9" fill="#fca5a5">❌ NEVER use admin ResourceResolver</text>
  <text x="375" y="252" font-size="9" fill="#fca5a5">❌ NEVER expose /crx or Felix Console</text>
  <text x="375" y="270" font-size="9" fill="#fca5a5">❌ NEVER log passwords or PII</text>
  <text x="375" y="288" font-size="9" fill="#a5f3fc">✅ Always close ResourceResolvers</text>
  <text x="375" y="304" font-size="9" fill="#a5f3fc">✅ Map service users in OSGi config</text>
</svg>