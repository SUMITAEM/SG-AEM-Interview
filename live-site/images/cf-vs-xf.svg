<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <linearGradient id="cf" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="xf" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="700" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">Content Fragments vs Experience Fragments</text>
  <!-- CF Side -->
  <rect x="20" y="50" width="310" height="250" rx="12" fill="url(#cf)" filter="url(#ds)"/>
  <text x="175" y="78" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Content Fragments</text>
  <text x="175" y="96" text-anchor="middle" font-size="10" fill="#cffafe" font-weight="600">STRUCTURED DATA — HEADLESS</text>
  <line x1="40" y1="106" x2="310" y2="106" stroke="rgba(255,255,255,0.2)"/>
  <text x="45" y="126" font-size="11" fill="#fff">📊 What: Raw structured data</text>
  <text x="45" y="146" font-size="11" fill="#fff">📁 Storage: /content/dam</text>
  <text x="45" y="166" font-size="11" fill="#fff">📐 Schema: CF Models (fields)</text>
  <text x="45" y="186" font-size="11" fill="#fff">🔌 Delivery: GraphQL / JSON API</text>
  <text x="45" y="206" font-size="11" fill="#fff">🎨 Layout: None (data only)</text>
  <text x="45" y="226" font-size="11" fill="#fff">📱 Channels: Any (web, mobile, IoT)</text>
  <rect x="40" y="242" width="270" height="44" rx="6" fill="rgba(0,0,0,0.2)"/>
  <text x="175" y="260" text-anchor="middle" font-size="10" fill="#a5f3fc" font-weight="600">USE CASES</text>
  <text x="175" y="278" text-anchor="middle" font-size="9" fill="#cffafe">Articles • Product data • API responses • FAQs</text>
  <!-- VS Divider -->
  <rect x="340" y="145" width="36" height="36" rx="18" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="358" y="169" text-anchor="middle" font-size="12" font-weight="800" fill="#f87171">VS</text>
  <!-- XF Side -->
  <rect x="385" y="50" width="295" height="250" rx="12" fill="url(#xf)" filter="url(#ds)"/>
  <text x="532" y="78" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Experience Fragments</text>
  <text x="532" y="96" text-anchor="middle" font-size="10" fill="#ede9fe" font-weight="600">VISUAL COMPONENTS — RENDERED</text>
  <line x1="405" y1="106" x2="660" y2="106" stroke="rgba(255,255,255,0.2)"/>
  <text x="405" y="126" font-size="11" fill="#fff">🎨 What: Component groups + layout</text>
  <text x="405" y="146" font-size="11" fill="#fff">📁 Storage: /content/experience-fragments</text>
  <text x="405" y="166" font-size="11" fill="#fff">📐 Schema: AEM components</text>
  <text x="405" y="186" font-size="11" fill="#fff">🔌 Delivery: HTML rendered</text>
  <text x="405" y="206" font-size="11" fill="#fff">🎨 Layout: Full visual design</text>
  <text x="405" y="226" font-size="11" fill="#fff">📱 Channels: Web, email, social, Target</text>
  <rect x="405" y="242" width="255" height="44" rx="6" fill="rgba(0,0,0,0.2)"/>
  <text x="532" y="260" text-anchor="middle" font-size="10" fill="#ddd6fe" font-weight="600">USE CASES</text>
  <text x="532" y="278" text-anchor="middle" font-size="9" fill="#ede9fe">Headers • Footers • Promos • Target offers</text>
  <!-- Analogy -->
  <text x="350" y="315" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">CF = Raw ingredients 🥩🥕  |  XF = Finished dish 🍽️</text>
</svg>