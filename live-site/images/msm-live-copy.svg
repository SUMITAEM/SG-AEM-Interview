<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0891b2"/></marker>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#d97706"/></marker>
  </defs>
  <rect width="700" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">MSM — Multi Site Manager (Blueprint → Live Copy)</text>
  <!-- Blueprint -->
  <rect x="40" y="55" width="180" height="170" rx="12" fill="#0891b2" filter="url(#ds)"/>
  <text x="130" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">📋 Blueprint</text>
  <text x="130" y="98" text-anchor="middle" font-size="10" fill="#cffafe" font-weight="600">SOURCE SITE (Master)</text>
  <line x1="55" y1="108" x2="205" y2="108" stroke="rgba(255,255,255,0.2)"/>
  <text x="60" y="126" font-size="9" fill="#a5f3fc">/content/mysite/en</text>
  <rect x="55" y="134" width="150" height="18" rx="3" fill="rgba(0,0,0,0.15)"/>
  <text x="130" y="148" text-anchor="middle" font-size="8" fill="#cffafe">Header (inherited)</text>
  <rect x="55" y="156" width="150" height="18" rx="3" fill="rgba(0,0,0,0.2)"/>
  <text x="130" y="170" text-anchor="middle" font-size="8" fill="#cffafe">Content (inherited)</text>
  <rect x="55" y="178" width="150" height="18" rx="3" fill="rgba(0,0,0,0.15)"/>
  <text x="130" y="192" text-anchor="middle" font-size="8" fill="#cffafe">Footer (inherited)</text>
  <text x="130" y="215" text-anchor="middle" font-size="8" fill="#a5f3fc" font-weight="600">Changes here ROLLOUT →</text>
  <!-- Rollout arrows -->
  <line x1="220" y1="100" x2="268" y2="75" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar2)"/>
  <line x1="220" y1="140" x2="268" y2="140" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar2)"/>
  <line x1="220" y1="180" x2="268" y2="205" stroke="#d97706" stroke-width="2.5" marker-end="url(#ar2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="8" fill="#d97706" font-weight="700" transform="rotate(-15,250,130)">ROLLOUT</text>
  <!-- Live Copy 1: DE -->
  <rect x="275" y="45" width="170" height="70" rx="10" fill="#7c3aed" filter="url(#ds)"/>
  <text x="360" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🇩🇪 Live Copy — DE</text>
  <text x="360" y="84" text-anchor="middle" font-size="9" fill="#ede9fe">/content/mysite/de</text>
  <text x="360" y="100" text-anchor="middle" font-size="8" fill="#ddd6fe">Inherits + translated content</text>
  <!-- Live Copy 2: FR -->
  <rect x="275" y="125" width="170" height="70" rx="10" fill="#059669" filter="url(#ds)"/>
  <text x="360" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🇫🇷 Live Copy — FR</text>
  <text x="360" y="164" text-anchor="middle" font-size="9" fill="#d1fae5">/content/mysite/fr</text>
  <text x="360" y="180" text-anchor="middle" font-size="8" fill="#a7f3d0">Inherits + local overrides</text>
  <!-- Live Copy 3: JP -->
  <rect x="275" y="205" width="170" height="70" rx="10" fill="#dc2626" filter="url(#ds)"/>
  <text x="360" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">🇯🇵 Live Copy — JP</text>
  <text x="360" y="244" text-anchor="middle" font-size="9" fill="#fecaca">/content/mysite/jp</text>
  <text x="360" y="260" text-anchor="middle" font-size="8" fill="#fca5a5">Inheritance cancelled (local)</text>
  <!-- Cancel icon on JP -->
  <rect x="425" y="250" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626"/>
  <text x="433" y="262" text-anchor="middle" font-size="10" fill="#dc2626">✗</text>
  <!-- Legend -->
  <rect x="475" y="50" width="200" height="175" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="575" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">Key Concepts</text>
  <line x1="490" y1="80" x2="660" y2="80" stroke="#e2e8f0"/>
  <circle cx="500" cy="100" r="5" fill="#d97706"/>
  <text x="515" y="104" font-size="9" fill="#475569"><tspan font-weight="600">Rollout</tspan> = push changes</text>
  <circle cx="500" cy="122" r="5" fill="#0891b2"/>
  <text x="515" y="126" font-size="9" fill="#475569"><tspan font-weight="600">Inheritance</tspan> = auto-sync</text>
  <circle cx="500" cy="144" r="5" fill="#dc2626"/>
  <text x="515" y="148" font-size="9" fill="#475569"><tspan font-weight="600">Cancel</tspan> = local override</text>
  <circle cx="500" cy="166" r="5" fill="#7c3aed"/>
  <text x="515" y="170" font-size="9" fill="#475569"><tspan font-weight="600">Sync Action</tspan> = what syncs</text>
  <circle cx="500" cy="188" r="5" fill="#059669"/>
  <text x="515" y="192" font-size="9" fill="#475569"><tspan font-weight="600">Trigger</tspan> = when to rollout</text>
  <text x="575" y="216" text-anchor="middle" font-size="8" fill="#94a3b8">Deep rollout = all levels</text>
  <text x="575" y="228" text-anchor="middle" font-size="8" fill="#94a3b8">Shallow = top level only</text>
  <text x="350" y="292" text-anchor="middle" font-size="9" fill="#64748b">Language Copy = MSM + translation workflow for i18n (different from Live Copy sync)</text>
</svg>