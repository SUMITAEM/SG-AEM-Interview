<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="ma" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0891b2"/></marker>
    <marker id="mr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#dc2626"/></marker>
  </defs>
  <rect width="680" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">OSGi Bundle Lifecycle</text>
  <!-- INSTALLED -->
  <rect x="30" y="100" width="100" height="50" rx="8" fill="#94a3b8" filter="url(#ds)"/>
  <text x="80" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">INSTALLED</text>
  <text x="80" y="140" text-anchor="middle" font-size="8" fill="#e2e8f0">JAR deployed</text>
  <!-- Arrow → RESOLVED -->
  <line x1="130" y1="125" x2="158" y2="125" stroke="#0891b2" stroke-width="2" marker-end="url(#ma)"/>
  <!-- RESOLVED -->
  <rect x="165" y="100" width="100" height="50" rx="8" fill="#3b82f6" filter="url(#ds)"/>
  <text x="215" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">RESOLVED</text>
  <text x="215" y="140" text-anchor="middle" font-size="8" fill="#dbeafe">Deps satisfied</text>
  <!-- Arrow → STARTING -->
  <line x1="265" y1="125" x2="293" y2="125" stroke="#0891b2" stroke-width="2" marker-end="url(#ma)"/>
  <!-- STARTING -->
  <rect x="300" y="100" width="100" height="50" rx="8" fill="#d97706" filter="url(#ds)"/>
  <text x="350" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">STARTING</text>
  <text x="350" y="140" text-anchor="middle" font-size="8" fill="#fef3c7">@Activate runs</text>
  <!-- Arrow → ACTIVE -->
  <line x1="400" y1="125" x2="428" y2="125" stroke="#0891b2" stroke-width="2" marker-end="url(#ma)"/>
  <!-- ACTIVE (highlighted) -->
  <rect x="435" y="85" width="110" height="70" rx="10" fill="#059669" filter="url(#ds)" stroke="#34d399" stroke-width="2"/>
  <text x="490" y="112" text-anchor="middle" font-size="16">✅</text>
  <text x="490" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ACTIVE</text>
  <text x="490" y="148" text-anchor="middle" font-size="8" fill="#d1fae5">Ready to serve</text>
  <!-- Arrow → STOPPING -->
  <line x1="545" y1="125" x2="573" y2="125" stroke="#dc2626" stroke-width="2" marker-end="url(#mr)"/>
  <!-- STOPPING -->
  <rect x="580" y="100" width="80" height="50" rx="8" fill="#dc2626" filter="url(#ds)"/>
  <text x="620" y="122" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">STOPPING</text>
  <text x="620" y="138" text-anchor="middle" font-size="8" fill="#fecaca">@Deactivate</text>
  <!-- Arrow back to RESOLVED -->
  <path d="M620,150 L620,200 L215,200 L215,155" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#mr)"/>
  <text x="420" y="215" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="500">stop → returns to RESOLVED</text>
  <!-- UNINSTALLED (separate) -->
  <rect x="280" y="235" width="120" height="40" rx="8" fill="#1e293b" filter="url(#ds)"/>
  <text x="340" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">UNINSTALLED</text>
  <!-- Arrow from RESOLVED to UNINSTALLED -->
  <line x1="215" y1="155" x2="215" y2="255" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="215" y1="255" x2="275" y2="255" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#mr)"/>
  <text x="240" y="248" font-size="8" fill="#64748b">uninstall</text>
  <!-- Legend -->
  <rect x="30" y="55" width="620" height="26" rx="5" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="45" y="72" font-size="9" fill="#475569" font-weight="600">Key Annotations:</text>
  <text x="155" y="72" font-size="9" fill="#475569">@Activate (STARTING) → @Modified (config change) → @Deactivate (STOPPING)</text>
  <text x="560" y="72" font-size="9" fill="#059669" font-weight="700">Goal: ACTIVE ✅</text>
</svg>