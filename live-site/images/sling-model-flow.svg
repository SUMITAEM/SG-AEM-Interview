<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="ds"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0,0 8,3 0,6" fill="#0891b2"/></marker>
  </defs>
  <rect width="700" height="360" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">Sling Model — Injection &amp; Lifecycle</text>
  <!-- HTL -->
  <rect x="30" y="55" width="130" height="70" rx="10" fill="#059669" filter="url(#ds)"/>
  <text x="95" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">HTL Template</text>
  <text x="95" y="98" text-anchor="middle" font-size="9" fill="#d1fae5">data-sly-use.model=</text>
  <text x="95" y="112" text-anchor="middle" font-size="8" fill="#a7f3d0">"com...HeroModel"</text>
  <!-- Arrow -->
  <line x1="160" y1="90" x2="198" y2="90" stroke="#0891b2" stroke-width="2" marker-end="url(#ar)"/>
  <text x="179" y="83" text-anchor="middle" font-size="8" fill="#64748b">adaptTo()</text>
  <!-- Model Box -->
  <rect x="205" y="45" width="280" height="240" rx="12" fill="#7c3aed" filter="url(#ds)"/>
  <text x="345" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">@Model(adaptables = Resource.class)</text>
  <line x1="220" y1="82" x2="470" y2="82" stroke="rgba(255,255,255,0.2)"/>
  <!-- Injectors -->
  <text x="225" y="102" font-size="10" font-weight="600" fill="#ede9fe">Injection Annotations:</text>
  <rect x="220" y="110" width="250" height="22" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="230" y="126" font-size="10" fill="#ddd6fe" font-family="'Consolas', monospace">@ValueMapValue</text>
  <text x="370" y="126" font-size="8" fill="#c4b5fd">← JCR properties</text>
  <rect x="220" y="136" width="250" height="22" rx="4" fill="rgba(0,0,0,0.15)"/>
  <text x="230" y="152" font-size="10" fill="#ddd6fe" font-family="'Consolas', monospace">@ChildResource</text>
  <text x="370" y="152" font-size="8" fill="#c4b5fd">← child nodes</text>
  <rect x="220" y="162" width="250" height="22" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="230" y="178" font-size="10" fill="#ddd6fe" font-family="'Consolas', monospace">@OSGiService</text>
  <text x="370" y="178" font-size="8" fill="#c4b5fd">← OSGi services</text>
  <rect x="220" y="188" width="250" height="22" rx="4" fill="rgba(0,0,0,0.15)"/>
  <text x="230" y="204" font-size="10" fill="#ddd6fe" font-family="'Consolas', monospace">@Self</text>
  <text x="370" y="204" font-size="8" fill="#c4b5fd">← adaptable itself</text>
  <rect x="220" y="214" width="250" height="22" rx="4" fill="rgba(0,0,0,0.2)"/>
  <text x="230" y="230" font-size="10" fill="#ddd6fe" font-family="'Consolas', monospace">@ResourcePath</text>
  <text x="370" y="230" font-size="8" fill="#c4b5fd">← resource by path</text>
  <!-- PostConstruct -->
  <rect x="220" y="248" width="250" height="26" rx="4" fill="#d97706"/>
  <text x="345" y="266" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">@PostConstruct → init()</text>
  <!-- Arrow from JCR -->
  <rect x="530" y="55" width="140" height="70" rx="10" fill="#0891b2" filter="url(#ds)"/>
  <text x="600" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">JCR Resource</text>
  <text x="600" y="98" text-anchor="middle" font-size="9" fill="#cffafe">/content/mysite/page</text>
  <text x="600" y="112" text-anchor="middle" font-size="8" fill="#a5f3fc">jcr:title, description...</text>
  <line x1="530" y1="90" x2="492" y2="90" stroke="#0891b2" stroke-width="2" marker-end="url(#ar)"/>
  <!-- OSGi Service -->
  <rect x="530" y="145" width="140" height="50" rx="10" fill="#d97706" filter="url(#ds)"/>
  <text x="600" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">OSGi Services</text>
  <text x="600" y="186" text-anchor="middle" font-size="8" fill="#fef3c7">@Reference injection</text>
  <line x1="530" y1="170" x2="492" y2="170" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Output -->
  <rect x="225" y="295" width="250" height="45" rx="8" fill="#1e293b"/>
  <text x="350" y="314" text-anchor="middle" font-size="10" font-weight="600" fill="#22d3ee">Output: getTitle(), getDescription()</text>
  <text x="350" y="330" text-anchor="middle" font-size="9" fill="#94a3b8">Used in HTL: ${model.title}, ${model.description}</text>
  <line x1="345" y1="280" x2="345" y2="295" stroke="#0891b2" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- Best Practice -->
  <rect x="530" y="220" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="600" y="240" text-anchor="middle" font-size="9" font-weight="700" fill="#0e7490">Best Practices</text>
  <text x="600" y="254" text-anchor="middle" font-size="8" fill="#64748b">Interface + Impl pattern</text>
  <text x="600" y="266" text-anchor="middle" font-size="8" fill="#64748b">OPTIONAL injection</text>
  <text x="600" y="278" text-anchor="middle" font-size="8" fill="#64748b">@Exporter for JSON</text>
  <text x="350" y="355" text-anchor="middle" font-size="9" fill="#94a3b8">defaultInjectionStrategy = OPTIONAL prevents NPEs when properties are missing</text>
</svg>